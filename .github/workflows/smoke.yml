name: CPU verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'numpy==2.5.5'
      - name: Input validation, replication integrity, and frozen checkpoint replay
        run: python -m unittest discover -s tests -v
      - name: Publish the NumPy replay receipt in the job log
        run: python joint/replay_cpu.py
      - name: Saved classifier predicts the documented example
        run: |
          out=$(python joint/infer.py --header 2 0 0 0 --tokens 0 1 2 3 2 0 3 1 --query 1)
          echo "$out"
          python -c 'import json,sys; r=json.loads(sys.argv[1]); assert r=={"class":1,"retained_bank":1,"pair_layout":1,"expert":1,"recurrent_steps":2}, r' "$out"

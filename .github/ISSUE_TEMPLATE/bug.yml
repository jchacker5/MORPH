name: Bug report
description: A script crashes, a command in the docs is wrong, or a checksum does not match.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the commit, command, full error and your Python version and platform.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected

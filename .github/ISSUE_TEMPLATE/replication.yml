name: Replication or counterexample
description: Report a result that confirms, contradicts or fails to reproduce a MORPH finding.
labels: ["replication"]
body:
  - type: input
    id: claim
    attributes:
      label: Which result?
      description: Paper section, table, figure or checkpoint.
      placeholder: "Table 3, grouping-and-memory classifier 9,999/10,000"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Commit and command
      description: The exact commit SHA and the commands you ran.
      render: sh
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Hardware and software
      placeholder: "M3 Pro 18 GB, macOS 15, Python 3.12.12, mlx 0.32.4"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What you observed
      description: Numbers, seeds and denominators. Paste or attach output. A failed replication is a useful result.
    validations:
      required: true
